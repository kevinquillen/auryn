[package]
name = "auryn"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Kevin Quillen <kevin@kevinquillen.com>"]
repository = "https://github.com/kevinquillen/auryn"
homepage = "https://github.com/kevinquillen/auryn"
description = "Browse, search, preview, and resume AI coding sessions from a single terminal interface."
readme = "README.md"
keywords = ["tui", "ai", "cli", "sessions", "claude"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
fuzzy-matcher = "0.3.7"
ratatui = "0.30.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.18"
toml = "1.1.2"
